name: Lint Django Project

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run linter with auto-fix
        run: |
          ruff check --fix .

      - name: Check remaining issues
        run: |
          ruff check . --output-format=github
        continue-on-error: true

      - name: Create ruff config to ignore common Django patterns
        run: |
          cat > pyproject.toml << 'EOF'
          [tool.ruff]
          ignore = ["F403", "F405"]
          EOF

      - name: Final lint check
        run: |
          ruff check . --output-format=github
