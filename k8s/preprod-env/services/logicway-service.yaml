apiVersion: v1
kind: Service
metadata:
  name: logicway
  labels:
    app: logicway
  namespace: preprod
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "logicway-preprod"
spec:
  selector:
    app: logicway
  ports:
    - name: http-django-8000
      port: 80
      targetPort: 8000
  type: ClusterIP
