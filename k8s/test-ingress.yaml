apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-ingress
  namespace: test
spec:
  ingressClassName: tailscale
  rules:
  - host: test-logicway
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /logicway
        pathType: Prefix
        backend:
          service:
            name: logicway
            port:
              number: 8000
      - path: /route-engine
        pathType: Prefix
        backend:
          service:
            name: route-engine
            port:
              number: 8001
